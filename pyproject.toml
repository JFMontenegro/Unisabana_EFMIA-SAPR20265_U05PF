[project]
name = "agente-inversor"
version = "1.0.0"
description = "Agente de aprendizaje por refuerzo que decide exposición a un activo — Proyecto final, Simulación y Aprendizaje por Refuerzo, Universidad de La Sabana"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Grupo 8" }]
dependencies = [
    "gymnasium>=1.0",
    "torch>=2.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "joblib>=1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "jupyter>=1.0", "nbformat>=5.10"]
ppo = [
    "stable-baselines3>=2.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # el ancho lo controla el formateador
    "RUF001", # tipografía deliberada en etiquetas de figuras (– y ×)
    "RUF002", # los docstrings están en español, con tildes
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # sys.path antes de los imports locales
